<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Missions</title>
<style>
:root{--c:#1f5f8b;--c2:#e8f0f6;--bg:#f3f5f7;--card:#fff;--txt:#1d2329;--mut:#6b7680;--bd:#dde3e8;--ok:#2e7d32;--warn:#ef6c00;--err:#c62828;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c)}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--c);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px #0002}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:12px;opacity:.85}
header button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;position:sticky;top:50px;z-index:19}
nav.tabs button{border:0;background:none;padding:12px 12px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:var(--c);border-bottom-color:var(--c)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--c);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:var(--c2);color:var(--c)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.err{background:var(--err)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.st-À-attribuer{background:#fdecea;color:#b71c1c}
.st-Attribué{background:#e3f2fd;color:#0d47a1}
.st-En-cours{background:#fff3e0;color:#e65100}
.st-À-poursuivre{background:#fff8e1;color:#8d6e00}
.st-Terminé{background:#e8f5e9;color:#1b5e20}
.st-Facturé{background:#eceff1;color:#455a64}
.st-Annulé{background:#f5f5f5;color:#9e9e9e;text-decoration:line-through}
.urg{background:var(--err);color:#fff}
.new{background:var(--warn);color:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.bon{cursor:pointer;position:relative}
.bon .t{font-weight:700}
.bon .adr{font-size:14px}
.bon.urgent{border-left:5px solid var(--err)}
.bon.nouveau{border-left:5px solid var(--warn)}
.bon.appele{border-left:5px solid var(--ok);background:#f1f8f1}
.appel{border:2px dashed var(--bd);background:#fff;color:var(--mut);border-radius:20px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.appel.on{border:2px solid var(--ok);background:var(--ok);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* Modal */
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 20px}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:16px}}
.mh{position:sticky;top:0;background:var(--c);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.mh h2{margin:0;font-size:16px;flex:1}
.mh button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:16px;cursor:pointer}
.mb{padding:12px}
/* Login */
.login{max-width:340px;margin:8vh auto;text-align:center;padding:0 16px}
.login h1{color:var(--c);margin:0 0 4px}
.dots{display:flex;justify-content:center;gap:12px;margin:22px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--c)}
.dots i.f{background:var(--c)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:16px;font-size:22px;border-radius:14px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.pad button:active{background:var(--c2)}
/* Bottom nav compagnon */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:30}
.bnav button{flex:1;border:0;background:none;padding:10px 4px 12px;color:var(--mut);font-size:12px;cursor:pointer;position:relative}
.bnav button.on{color:var(--c);font-weight:700}
.bnav .ic{font-size:22px;display:block}
.badge{position:absolute;top:4px;left:55%;background:var(--err);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
/* Photos & signature */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.photos div{position:relative}
.photos img{width:100%;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.photos button{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.photos input{width:100%;font-size:11px;padding:3px;margin-top:2px;border:1px solid var(--bd);border-radius:6px}
canvas.sig{width:100%;height:180px;background:#fff;border:2px dashed var(--bd);border-radius:10px;touch-action:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:10px 4px;cursor:pointer;background:#fff;color:var(--txt);font-weight:600;font-size:13px;border-right:1px solid var(--bd)}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label.on{background:var(--c);color:#fff}
/* Planning */
.plan{overflow-x:auto}
.plan table{border-collapse:collapse;min-width:820px;width:100%;background:#fff}
.plan th,.plan td{border:1px solid var(--bd);padding:6px;vertical-align:top;font-size:12.5px}
.plan th{background:var(--c2);position:sticky;top:0}
.plan td.nm{font-weight:700;white-space:nowrap;width:110px}
.plan .it{background:var(--c2);border-left:4px solid var(--c);border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer}
.plan .it.urg{border-left-color:var(--err)}
.plan td.today{background:#fffde7}
/* Toast */
#offbar{position:sticky;top:0;z-index:21;background:#424242;color:#fff;padding:8px 12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
#load{position:fixed;inset:0;background:#fff8;z-index:98;display:flex;align-items:center;justify-content:center}
.spin{width:42px;height:42px;border:4px solid var(--c2);border-top-color:var(--c);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.banner{background:#fff3e0;border:1px solid #ffcc80;color:#8a4b00;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.drop{border:2px dashed var(--c);border-radius:var(--r);padding:30px 10px;text-align:center;background:#fff;cursor:pointer}
.drop.over{background:var(--c2)}
pre.txtbon{white-space:pre-wrap;font:12.5px/1.4 ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:320px;overflow:auto}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut)}
.fab{position:fixed;right:18px;bottom:22px;z-index:25;border-radius:30px;padding:14px 20px;box-shadow:0 4px 14px #0004}
.list-check{width:20px;height:20px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="load" class="hide"><div class="spin"></div></div>

<script>
/* ============================================================
   MISSIONS CHANTIER – interface (bureau + compagnons)
   Propriétaire : Guillaume Richard – reproduction interdite.
   ============================================================ */
const STATUTS = ['À attribuer','Attribué','En cours','À poursuivre','Terminé','Facturé','Annulé'];
const S = { pin: '', user: null, data: null, tab: 'accueil', filtre: 'actifs', fComp: '', q: '', semaine: lundi(new Date()), sel: {} };

/* ---------- utilitaires ---------- */
/* Stockage du téléphone : copie en mémoire + IndexedDB (gros volumes : photos, PDF) */
const MEM={}; let _db=null;
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('missions',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbLoad(){ try{ _db=await idbOpen(); await new Promise((res)=>{ const tx=_db.transaction('kv','readonly'); const st=tx.objectStore('kv'); const rq=st.openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ MEM[c.key]=c.value; c.continue(); } else res(); }; rq.onerror=()=>res(); }); }catch(e){ /* navigateur sans IndexedDB : mémoire seule */ } }
function idbPut(k,v){ if(!_db) return; try{ const tx=_db.transaction('kv','readwrite'); if(v===null) tx.objectStore('kv').delete(k); else tx.objectStore('kv').put(v,k); }catch(e){} }
function lsGet(k){ return MEM['mc_'+k]===undefined?null:MEM['mc_'+k]; }
function lsSet(k,v){ if(v===null) delete MEM['mc_'+k]; else MEM['mc_'+k]=String(v); idbPut('mc_'+k,v===null?null:String(v)); return true; }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return iso(new Date()); }
function hhmm(d){ d=d||new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fr(isoStr){ const m=String(isoStr||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m? m[3]+'/'+m[2]+'/'+m[1].slice(2) : (isoStr||''); }
function jourFr(isoStr){ const d=new Date(isoStr+'T12:00'); return isNaN(d)?'':d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); }
function lundi(d){ d=new Date(d); const j=(d.getDay()+6)%7; d.setDate(d.getDate()-j); d.setHours(12,0,0,0); return d; }
function stCls(s){ return 'st-'+String(s||'').replace(/\s+/g,'-'); }
function pill(s){ return '<span class="pill '+stCls(s)+'">'+esc(s)+'</span>'; }
function confirmer(msg,oui,non,danger){
  return new Promise(res=>{
    const d=document.createElement('div'); d.id='cf'; d.className='ov'; d.style.zIndex='90'; d.style.alignItems='center';
    d.innerHTML='<div class="modal" style="max-width:420px;border-radius:16px;margin:16px;padding:0"><div class="mb" style="padding:18px 16px 8px;white-space:pre-line;font-size:16px">'+esc(msg)+'</div>'+
      '<div class="row" style="padding:8px 16px 16px;justify-content:flex-end"><button class="btn sec" id="cf_non">'+esc(non||'Annuler')+'</button><button class="btn '+(danger?'err':'')+'" id="cf_oui">'+esc(oui||'OK')+'</button></div></div>';
    const fin=v=>{ d.remove(); res(v); };
    d.addEventListener('click',e=>{ if(e.target===d) fin(false); });
    document.body.appendChild(d);
    d.querySelector('#cf_non').onclick=()=>fin(false); d.querySelector('#cf_oui').onclick=()=>fin(true);
  });
}
function toast(m,ms){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),ms||2600); }
function busy(on){ $('#load').classList.toggle('hide',!on); }
function comp(id){ return (S.data&&S.data.compagnons||[]).find(c=>c.id===id); }
function compNom(id){ const c=comp(id); return c?c.nom:''; }
function telLink(t){ return 'tel:'+String(t||'').replace(/[^\d+]/g,''); }
function adrGps(b){ return ((b.adresse||'').replace(/\s+–.*$/,'')+' '+(b.ville||'')).trim(); }
function mapsLink(b){ return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(adrGps(b)); }
function wazeLink(b){ return 'https://waze.com/ul?navigate=yes&q='+encodeURIComponent(adrGps(b)); }
function telsHtml(txt){ return esc(txt).replace(/((?:\+33\s?|0)[1-9](?:[\s.\-]?\d{2}){4})/g,function(t){ return '<a href="tel:'+t.replace(/[^\d+]/g,'')+'" onclick="event.stopPropagation()">'+t+'</a>'; }); }
function garderCopie(){}
function ouvrirBon(id){
  const b=S.data.bons.find(x=>x.id===id); if(!b) return;
  let p=null; try{ p=JSON.parse(lsGet('pdf_'+id)||'null'); }catch(e){}
  if(p&&p.b64){
    const bin=atob(p.b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=(p.nom||('Bon '+(b.numero||'')+'.pdf')).replace(/[\\/:*?"<>|]/g,'-'); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); return;
  }
  if(navigator.onLine&&b.fichierBonUrl) window.open(b.fichierBonUrl,'_blank');
  else toast('📶 Le PDF du bon n\'a pas encore été chargé dans le téléphone (il le sera au prochain passage avec du réseau). Le texte du bon est en bas de la mission.',6000);
}
function enRetard(b){ return b.dateLimite && b.dateLimite<today() && ['Terminé','Facturé','Annulé'].indexOf(b.statut)<0; }

function apiUrl(){ return lsGet('api')||''; }
async function api(fn,...args){
  if(!apiUrl()) throw new Error('Appli non configurée : ouvre le lien d\'installation envoyé par le bureau');
  if(!navigator.onLine) throw new Error('Hors connexion');
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),fn==='envoyerRapport'?180000:45000);
  let r;
  try{ r=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({rpc:fn,args}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl.signal}); }
  catch(e){ throw new Error('Hors connexion (réseau)'); }
  finally{ clearTimeout(to); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('Hors connexion (réponse illisible)'); }
  if(!j.ok) throw new Error(j.erreur||'Erreur');
  return j.result;
}
async function call(fn,...args){
  busy(true);
  try{ return await api(fn,...args); }
  catch(e){ toast('⚠️ '+(e.message||e),4000); throw e; }
  finally{ busy(false); }
}
function applyColor(){ const c=S.data&&S.data.config&&S.data.config.COULEUR; if(c){ document.documentElement.style.setProperty('--c',c); } }

/* ---------- démarrage ---------- */
function garderCopie(){ try{ lsSet('copie',JSON.stringify({t:Date.now(),data:S.data})); }catch(e){} }
function copieLocale(){ try{ return JSON.parse(lsGet('copie')||'null'); }catch(e){ return null; } }
function bandeauHorsLigne(){
  const el=document.getElementById('offbar'); if(!el) return;
  const c=copieLocale(); const off=S.horsLigne;
  el.className=off?'':'hide';
  el.innerHTML=off?'📶 <b>Sans réseau</b> – missions du '+(c?new Date(c.t).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'}):'?')+'. Tout fonctionne : les rapports partiront au retour du réseau.':'';
}
async function chargerPdfs(){ /* garde dans le téléphone le PDF de chaque mission ouverte */
  if(!S.data||!S.user||S.user.role==='admin') return;
  for(const b of S.data.bons.filter(x=>['Attribué','En cours','À poursuivre'].indexOf(x.statut)>=0&&x.fichierBonId)){
    if(lsGet('pdf_'+b.id)) continue;
    try{ const p=await api('bonPdf',S.pin,b.id); if(p&&p.b64) lsSet('pdf_'+b.id,JSON.stringify(p)); }catch(e){ break; }
  }
  /* nettoyage des PDF des missions terminées */
  Object.keys(MEM).filter(k=>k.indexOf('mc_pdf_')===0).forEach(k=>{ const id=k.slice(7); if(!S.data.bons.some(b=>b.id===id&&['Attribué','En cours','À poursuivre'].indexOf(b.statut)>=0)) lsSet('pdf_'+id,null); });
}
async function boot(){
  if(!apiUrl()){ renderNonConfig(); return; }
  if(!S.pin){ renderLogin(); return; }
  try{
    busy(true);
    S.data = await api('getData',S.pin);
    S.user = S.data.user; S.horsLigne=false;
    garderCopie(); applyColor(); render(); bandeauHorsLigne();
    envoyerFileAttente(); chargerPdfs();
  }catch(e){
    busy(false);
    if(/PIN/.test(e.message)){ lsSet('pin',null); S.pin=''; renderLogin(); toast('Code PIN refusé'); return; }
    const c=copieLocale();
    if(c&&c.data){ S.data=c.data; S.user=c.data.user; S.horsLigne=true; applyColor(); render(); bandeauHorsLigne(); }
    else renderHorsLigne(e.message);
    return;
  }
  busy(false);
}
async function refresh(silent){
  try{ if(!silent) busy(true); S.data=await api('getData',S.pin); S.user=S.data.user; S.horsLigne=false; garderCopie(); applyColor(); render(); bandeauHorsLigne(); chargerPdfs(); }
  catch(e){ if(/Hors connexion/.test(e.message)){ S.horsLigne=true; bandeauHorsLigne(); if(!silent) toast('📶 Pas de réseau : tu travailles sur la copie du téléphone'); } else toast('⚠️ '+e.message); }
  finally{ busy(false); }
}
function renderNonConfig(){
  $('#app').innerHTML='<div class="login"><h1>🔧 Missions</h1><p>Cette appli doit être ouverte une première fois avec le <b>lien d\'installation</b> envoyé par le bureau (par WhatsApp ou SMS).</p><p class="mut">Ouvre ce lien sur ce téléphone, avec du réseau.</p></div>';
}
window.addEventListener('online',async()=>{ toast('📶 Réseau retrouvé'); await envoyerFileAttente(); refresh(true); });
window.addEventListener('offline',()=>{ S.horsLigne=true; bandeauHorsLigne(); });
setInterval(()=>{ if(navigator.onLine&&S.pin&&apiUrl()) refresh(true); },120000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&navigator.onLine&&S.pin&&apiUrl()){ envoyerFileAttente(); refresh(true); } });
setInterval(()=>{ if(fileAttente().length&&navigator.onLine) envoyerFileAttente(); },60000);

function renderHorsLigne(msg){
  $('#app').innerHTML='<div class="login"><h1>📶</h1><p>Impossible de joindre le serveur.</p><p class="mut">'+esc(msg)+'</p>'+
    (fileAttente().length?'<div class="banner">'+fileAttente().length+' rapport(s) en attente d\'envoi sur ce téléphone.</div>':'')+
    '<button class="btn full" onclick="boot()">Réessayer</button></div>';
}

/* ---------- connexion ---------- */
let saisie='';
function renderLogin(){
  saisie='';
  $('#app').innerHTML='<div class="login"><h1>🔧 Missions</h1><div class="mut">Entre ton code PIN</div>'+
   '<div class="dots" id="dots"></div><div class="pad">'+
   [1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>'<button onclick="padKey(\''+k+'\')">'+k+'</button>').join('')+'</div></div>';
  drawDots();
}
function drawDots(){ const n=Math.max(4,saisie.length); $('#dots').innerHTML=Array.from({length:n},(_,i)=>'<i class="'+(i<saisie.length?'f':'')+'"></i>').join(''); }
async function padKey(k){
  if(k==='⌫'){ saisie=saisie.slice(0,-1); drawDots(); return; }
  if(k==='OK'){
    if(saisie.length<4) return toast('4 chiffres minimum');

function sansAccent(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
/* recherche : n° de bon, n° de fichier extranet, nom, adresse, ville, téléphone (avec ou sans espaces), donneur d'ordre, objet */
function correspond(b,q){
  const mots=sansAccent(q).split(/\s+/).filter(x=>x);
  const texte=sansAccent([b.numero,b.fichierOrigine,b.locataire,b.contact2,b.adresse,b.ville,b.donneurOrdre,b.objet,b.telLocataire,compNom(b.compagnonId)].join(' '));
  const chiffresQ=q.replace(/\D/g,'');
  if(chiffresQ.length>=4){ /* numéro de téléphone ou de bon tapé avec ou sans espaces / « / » */
    const chiffres=[b.telLocataire,b.contact2,b.numero,b.fichierOrigine].join(' ').replace(/\D/g,' ').replace(/\s+/g,'')+' '+String(b.telLocataire||'').replace(/\D/g,'')+' '+String(b.numero||'').replace(/\D/g,'');
    if(chiffres.indexOf(chiffresQ)>=0||chiffres.indexOf(chiffresQ.replace(/^33/,'0'))>=0) return true;
  }
  return mots.every(m=>texte.indexOf(m)>=0);
}
function rechercher(v){ S.q=v; S.filtre='tous'; S.fComp=''; S.tab='bons'; render(); const i=$('#main input[type=text]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }

/* --- lignes de prestations (codes BPU / références Sage) – jamais de prix --- */
function lignesDe(b){ try{ return JSON.parse(b.lignes||'[]'); }catch(e){ return []; } }
function bpuOptions(){ return '<datalist id="dl_bpu">'+(S.data.bpu||[]).map(x=>'<option value="'+esc(x.c)+'">'+esc(x.d)+(x.u?' ('+esc(x.u)+')':'')+'</option>').join('')+'</datalist>'; }
function bpuTrouve(code){ code=String(code||'').trim().toUpperCase(); return (S.data.bpu||[]).find(x=>String(x.c).trim().toUpperCase()===code); }
function editeurLignes(L,id,mode){ /* mode 'bureau' : qté commandée + réalisée ; 'compagnon' : qté réalisée */
  window['_L_'+id]=L;
  let h='<div id="lg_'+id+'" data-mode="'+(mode||'')+'">'+(L.length?'':'<div class="mut" style="padding:6px 0">Aucune ligne. Ajoute les références réalisées.</div>');

      '<input type="text" placeholder="Désignation" value="'+esc(l.des)+'" class="grow" style="min-width:140px" oninput="lgSet(\''+id+'\','+i+',\'des\',this.value)">'+
      '<button class="btn sec sm" onclick="lgDel(\''+id+'\','+i+')">✕</button></div>'+
      '<div class="row" style="margin-top:6px">'+

      '<span class="mut" style="margin-left:auto">Réalisé</span><button class="btn sec sm" onclick="lgPas(\''+id+'\','+i+',-1)">−</button>'+
      '<input type="number" step="any" min="0" id="lgq_'+id+'_'+i+'" value="'+esc(l.qte)+'" style="width:80px;text-align:center;font-weight:700" oninput="lgSet(\''+id+'\','+i+',\'qte\',this.value)">'+
      '<button class="btn sec sm" onclick="lgPas(\''+id+'\','+i+',1)">＋</button><span class="mut">'+esc(l.unite||'')+'</span></div></div>';
  });
  h+='<div class="row" style="margin-top:4px"><input type="text" list="dl_bpu" id="lgadd_'+id+'" class="grow" placeholder="＋ Ajouter : tape une référence ou un mot (ex. siphon)" oninput="lgCherche(\''+id+'\',this.value)" onkeydown="if(event.key===\'Enter\'){lgAdd(\''+id+'\',this.value)}"><button class="btn sm" onclick="lgAdd(\''+id+'\',$(\'#lgadd_'+id+'\').value)">Ajouter</button></div>'+

function lgRedraw(id){ const el=$('#lg_'+id); if(!el) return; const mode=el.dataset.mode; el.outerHTML=editeurLignes(window['_L_'+id],id,mode); $('#lg_'+id).dataset.mode=mode; if(window._lgChange) window._lgChange(id); }
function lgSet(id,i,k,v,redraw){ const L=window['_L_'+id]; L[i][k]=v; if(k==='code'){ const x=bpuTrouve(v); if(x){ L[i].des=x.d; L[i].unite=x.u||''; } } if(redraw) lgRedraw(id); else if(window._lgChange) window._lgChange(id); }
function lgPas(id,i,d){ const L=window['_L_'+id]; let q=parseFloat(String(L[i].qte||'0').replace(',','.'))||0; q=Math.max(0,Math.round((q+d)*100)/100); L[i].qte=String(q); $('#lgq_'+id+'_'+i).value=q; if(window._lgChange) window._lgChange(id); }
function lgDel(id,i){ window['_L_'+id].splice(i,1); lgRedraw(id); }
function lgCherche(id,q){
  const el=$('#lgres_'+id); q=String(q||'').trim().toLowerCase(); if(q.length<2){ el.innerHTML=''; return; }
  const R=(S.data.bpu||[]).filter(x=>(x.c+' '+x.d).toLowerCase().indexOf(q)>=0).slice(0,8);
  el.innerHTML=R.map(x=>'<div class="card" style="padding:8px;margin:4px 0;cursor:pointer" onclick="lgAdd(\''+id+'\',\''+esc(x.c).replace(/'/g,"\\'")+'\')"><b>'+esc(x.c)+'</b> – '+esc(x.d)+(x.u?' <span class="mut">('+esc(x.u)+')</span>':'')+'</div>').join('');

function lgAdd(id,v){
  v=String(v||'').trim(); if(!v) return;

  window['_L_'+id].push(x?{code:x.c,des:x.d,unite:x.u||'',qteCde:'',qte:'1'}:{code:'',des:v,unite:'',qteCde:'',qte:'1'});

}

function ouvrirImport(){
  const dossier=S.data.config.DOSSIER_IMPORT_URL;
  modal('Importer des bons','<div class="mb">'+
   '<div class="drop" id="drop" onclick="$(\'#fi\').click()"><div style="font-size:34px">📥</div><b>Dépose ici les bons Word (ou PDF)</b><div class="mut">ou touche pour choisir – plusieurs fichiers possibles</div></div>'+
   '<input type="file" id="fi" multiple accept=".doc,.docx,.pdf,.odt,.rtf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf" class="hide" onchange="importer(this.files)">'+
   '<div id="impRes" style="margin-top:12px"></div>'+
   (dossier?'<p class="mut">Astuce : tu peux aussi enregistrer les bons téléchargés directement dans le dossier Drive <a href="'+dossier+'" target="_blank">« Bons à importer »</a> (par Google Drive pour ordinateur) : ils sont importés tout seuls toutes les 5 minutes.</p>':'')+
  '</div>');
  const d=$('#drop');
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',ev=>importer(ev.dataTransfer.files));
}
function lireB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function importer(files){
  files=Array.from(files||[]); if(!files.length) return;
  const zone=$('#impRes');
  for(const f of files){
    const ligne=document.createElement('div'); ligne.className='card'; ligne.innerHTML='⏳ '+esc(f.name)+' – lecture…'; zone.appendChild(ligne);
    try{
      if(f.size>20e6) throw new Error('fichier trop lourd');
      const b64=await lireB64(f);
      const r=await api('importBon',S.pin,f.name,f.type,b64);
      const b=r.bon;
      if(!r.doublon) S.data.bons.push(b);
      ligne.innerHTML=(r.doublon?'⚠️ Déjà importé : ':'✅ ')+'<b>'+esc(b.numero)+'</b> – '+esc(b.adresse)+' '+esc(b.ville)+'<div class="mut">'+esc((b.objet||'').slice(0,120))+'</div>'+
        '<button class="btn sm" style="margin-top:6px" onclick="closeModal();editBon(\''+b.id+'\')">Vérifier & attribuer</button>';
    }catch(e){ ligne.innerHTML='❌ '+esc(f.name)+' : '+esc(e.message); }
  }
  render();
}

async function ajoutPhotos(inp){
  const fs=Array.from(inp.files||[]); inp.value='';
  for(const f of fs){ try{ R.photos.push({b64:await compresser(f,1400,0.7),legende:''}); }catch(e){ toast('Photo illisible'); } }
  dessinPhotos(); saveDraft();
}
function compresser(file,max,q,type){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width,h=img.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
      if(!type||type==='image/jpeg'){ x.fillStyle='#fff'; x.fillRect(0,0,w,h); }
      x.drawImage(img,0,0,w,h); res(c.toDataURL(type||'image/jpeg',q));
    }; img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function SignaturePad(cv,initial,onEnd){
  const ratio=Math.max(1,window.devicePixelRatio||1);
  const rect=cv.getBoundingClientRect(); cv.width=rect.width*ratio; cv.height=rect.height*ratio;
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  let draw=false, vide=true, last=null;
  if(initial){ const im=new Image(); im.onload=()=>{ ctx.drawImage(im,0,0,rect.width,rect.height); vide=false; }; im.src=initial; }
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown',e=>{ draw=true; last=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fill(); vide=false; });
  cv.addEventListener('pointermove',e=>{ if(!draw) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  const fin=()=>{ if(draw){ draw=false; onEnd&&onEnd(); } };
  cv.addEventListener('pointerup',fin); cv.addEventListener('pointercancel',fin); cv.addEventListener('pointerleave',fin);
  return { clear(){ ctx.clearRect(0,0,cv.width,cv.height); vide=true; }, data(){ return vide?'':cv.toDataURL('image/png'); }, vide(){ return vide; } };
}
async function validerRapport(){
  saveDraft();
  const manque=[];
  if(!R.travaux.trim()) manque.push('Travaux réalisés');
  if(!R.materiel.trim()) manque.push('Fournitures en plus (ou « Aucune »)');
  if(!R.reserves.trim()) manque.push('Observations (ou « Aucune »)');
  ['r_trav','r_mat','r_res'].forEach(i=>{ const el=$('#'+i); if(el) el.style.borderColor=el.value.trim()?'':'var(--err)'; });
  if(manque.length){ const el=$('#'+(!R.travaux.trim()?'r_trav':!R.materiel.trim()?'r_mat':'r_res')); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } return toast('À remplir : '+manque.join(', '),4500); }
  if(!R.heureDepart){ R.heureDepart=hhmm(); $('#r_dep').value=R.heureDepart; }
  if(!R.absent&&(!sig||sig.vide())) { if(!(await confirmer('Pas de signature de l\'occupant.\nEnvoyer quand même ?','Envoyer','Revenir'))) return; }
  if(!R.absent) R.signature=sig.data();
  const att=enAttente(R.bonId);
  const envoi=Object.assign({},R,{clientRef:(att&&att.clientRef)||R.clientRef||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))});
  R.clientRef=envoi.clientRef; brouillonSet(R.bonId,R);
  busy(true);
  try{
    const res=await api('envoyerRapport',S.pin,envoi);
    retirerFile(R.bonId); lsSet('err_'+R.bonId,null);
    lsSet('draft_'+R.bonId,null); R=null; closeModal(true);
    toast(res.mail===false?'✅ Rapport enregistré (e-mail non parti)':'✅ Rapport envoyé au bureau',3500);
    refresh(true);
  }catch(e){
    if(estDefinitif(e)){ retirerFile(R.bonId); lsSet('draft_'+R.bonId,null); R=null; closeModal(true); toast('Ce bon a été supprimé ou réattribué par le bureau.',5000); refresh(true); }
    else if(/PIN/.test(e.message)){ toast('⚠️ '+e.message,4500); }
    else {
      ajoutFile(envoi); if(!estReseau(e)) lsSet('err_'+R.bonId,String(e.message||e));
      lsSet('draft_'+R.bonId,null); R=null; closeModal(true);
      toast(estReseau(e)?'📶 Pas de réseau : rapport gardé sur le téléphone. Il partira tout seul au retour du réseau – inutile de le refaire.':'⚠️ Rapport gardé, mais erreur serveur : '+e.message,6000);
      renderCompagnon();
    }
  }finally{ busy(false); }
}
/* file d'attente hors réseau */
function fileAttente(){
  let f=[]; try{ f=JSON.parse(lsGet('outbox')||'[]'); }catch(e){ f=[]; }
  if(!f.length&&window._outboxMem) f=window._outboxMem;
  /* un seul rapport en attente par bon (le plus récent) – nettoie aussi les anciens doublons */
  const parBon={}; f.forEach(x=>{ parBon[x.bonId]=x; }); const g=Object.keys(parBon).map(k=>parBon[k]);
  if(g.length!==f.length) lsSet('outbox',JSON.stringify(g));
  return g;
}
function enAttente(bonId){ return fileAttente().find(x=>x.bonId===bonId); }
function ajoutFile(r){
  let f=fileAttente(); const old=f.find(x=>x.bonId===r.bonId);
  if(old) r.clientRef=old.clientRef; /* même référence → jamais envoyé deux fois */
  f=f.filter(x=>x.bonId!==r.bonId); f.push(r);
  if(!lsSet('outbox',JSON.stringify(f))){ toast('⚠️ Mémoire pleine : garde la page ouverte et réessaie',6000); window._outboxMem=f; }
}
function retirerFile(bonId){ const f=fileAttente().filter(x=>x.bonId!==bonId); lsSet('outbox',JSON.stringify(f)); window._outboxMem=null; }
function estDefinitif(e){ return /introuvable|non attribuée|n'existe plus/i.test(String(e&&e.message||e)); }
function purgerFile(){ /* rapports en attente dont le bon n'est plus attribué à ce compagnon (supprimé, réattribué) */
  if(!S.data||!S.user||S.user.role==='admin') return;
  const ids=S.data.bons.filter(b=>['Attribué','En cours','À poursuivre'].indexOf(b.statut)>=0).map(b=>b.id);
  fileAttente().forEach(x=>{ if(ids.indexOf(x.bonId)<0){ retirerFile(x.bonId); lsSet('draft_'+x.bonId,null); lsSet('err_'+x.bonId,null); } });
}
function estReseau(e){ return !navigator.onLine||/network|réseau|connexion|connection|timeout|failed to fetch|HTTP 0|Hors connexion/i.test(String(e&&e.message||e)); }
let _envoiEnCours=false;
async function envoyerFileAttente(manuel){
  const f=fileAttente();
  if(!f.length||_envoiEnCours||!S.pin) return;
  _envoiEnCours=true; let ok=0;
  if(manuel) busy(true);
  for(const r of f.slice()){
    try{ await api('envoyerRapport',S.pin,r); ok++; retirerFile(r.bonId); lsSet('draft_'+r.bonId,null); lsSet('err_'+r.bonId,null); }
    catch(e){
      if(estReseau(e)){ if(manuel) toast('📶 Toujours pas de réseau – le rapport reste gardé, rien n\'est perdu',4000); break; }
      if(estDefinitif(e)){ retirerFile(r.bonId); lsSet('draft_'+r.bonId,null); lsSet('err_'+r.bonId,null); if(manuel) toast('Ce bon a été supprimé ou réattribué par le bureau : rapport retiré.',5000); continue; }
      lsSet('err_'+r.bonId,String(e.message||e)); if(manuel) toast('⚠️ Erreur serveur : '+(e.message||e),6000);
    }
  }
  if(manuel) busy(false);
  _envoiEnCours=false;
  if(ok){ toast('📤 '+ok+' rapport(s) en attente envoyé(s)'); refresh(true); }
}

let _onClose=null;
function modal(titre,html,onClose){
  closeModal(true); _onClose=onClose||null;
  const ov=document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML='<div class="modal"><div class="mh"><h2>'+esc(titre)+'</h2><button onclick="closeModal()">✕</button></div>'+html+'</div>';
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov); document.body.style.overflow='hidden';
}
function closeModal(silencieux){
  const o=$('#ov'); if(!o) return;
  if(!silencieux&&_onClose) _onClose();
  _onClose=null; o.remove(); document.body.style.overflow='';
  if(!silencieux&&S.user&&S.user.role!=='admin') renderCompagnon();
}
